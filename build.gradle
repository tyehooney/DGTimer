// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.7.10"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
        classpath googleLibs.services
        classpath googleLibs.hilt.android.gradle.plugin
        classpath googleLibs.firebase.crashlytics.gradle
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    alias libs.plugins.android.app apply false
    alias libs.plugins.kotlin.android apply false
    alias libs.plugins.kotlin.kapt apply false
    alias libs.plugins.kotlin.parcelize apply false
    alias googleLibs.plugins.google.gms.services apply false
    alias googleLibs.plugins.dagger.hilt.android apply false
    alias googleLibs.plugins.firebase.crashlytics apply false
    alias(libs.plugins.android.library) apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()

        maven {
            url 'http://devrepo.kakao.com/nexus/content/groups/public/'
            allowInsecureProtocol = true
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}