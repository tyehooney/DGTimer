plugins {
    alias libs.plugins.android.app
    alias libs.plugins.kotlin.android
    alias libs.plugins.kotlin.kapt
    alias libs.plugins.kotlin.parcelize
    alias googleLibs.plugins.google.gms.services
    alias googleLibs.plugins.dagger.hilt.android
    alias googleLibs.plugins.firebase.crashlytics
}

def localProperties = new Properties()
localProperties.load(new FileInputStream(rootProject.file("local.properties")))

android {
    signingConfigs {
        release {
            storeFile file(localProperties['signedStoreDir']) // 기준은 App 폴더 기준이다.

            storePassword localProperties['signedStorePassword']

            keyAlias localProperties['signedKeyAlias']

            keyPassword localProperties['signedKeyAliasPassword']
        }
    }

    defaultConfig {
        applicationId "com.tyehooney.dgtimer"
        minSdkVersion 26
        targetSdkVersion 34
        compileSdk 34
        versionCode 23
        versionName "1.8.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug{
            resValue("string", "adfit_id", localProperties['adfitId'])
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue("string", "adfit_id", localProperties['adfitId'])
            signingConfig signingConfigs.release
        }
    }

    viewBinding{
        enabled = true
    }
    kapt {
        correctErrorTypes true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'com.tyehooney.dgtimer'
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation androidxLibs.appcompat
    implementation androidxLibs.constraintlayout
    implementation libs.material
    implementation androidxLibs.activity.ktx
    testImplementation libs.junit
    androidTestImplementation androidxLibs.junit
    androidTestImplementation androidxLibs.espresso.core

    implementation androidxLibs.room.runtime
    implementation androidxLibs.room.ktx
    kapt androidxLibs.room.compiler
    annotationProcessor androidxLibs.room.compiler

    // Google Firebase
    implementation platform(googleLibs.firebase.bom)
    implementation googleLibs.firebase.firestore.ktx
    implementation googleLibs.firebase.crashlytics.ktx
    implementation googleLibs.firebase.analytics.ktx

    implementation androidxLibs.recyclerview

    implementation androidxLibs.lifecycle.extensions

    //https://github.com/bumptech/glide
    implementation extLibs.glide
    annotationProcessor extLibs.glide.compiler

    // Lifecycle components
    implementation androidxLibs.lifecycle.extensions
    // noinspection LifecycleAnnotationProcessorWithJava8
    annotationProcessor androidxLibs.lifecycle.compiler

    // kakao adfit
    implementation extLibs.kakao.ads.base

    // hilt
    implementation googleLibs.hilt.android
    annotationProcessor googleLibs.dagger.hilt.compiler
    kapt googleLibs.hilt.android.compiler
    kapt libs.hilt.compiler

    // coroutines
    implementation libs.kotlinx.coroutines.android
    implementation libs.kotlinx.coroutines.core
}